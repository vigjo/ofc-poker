name: ofc-poker

# Local development dependencies only. The Quarkus backend and Vite frontend
# run natively on the host (./mvnw quarkus:dev, npm run dev) for fast reload;
# this compose file just provides the stateful services they talk to.
services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.6.1
    # In-memory mode avoids a SQLite-on-mounted-volume permission issue on
    # Docker Desktop and is fine here: local dev/test data never needs to
    # survive a container restart.
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8000 | grep -q 400"]
      interval: 5s
      timeout: 5s
      retries: 10

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:5.3.4
    environment:
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    ports:
      - "8001:8001"
    depends_on:
      dynamodb-local:
        condition: service_healthy
