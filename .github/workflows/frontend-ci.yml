name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # openapi-typescript's peer range hasn't caught up to TS 6.x yet; the
      # generated types themselves are unaffected (see frontend/package.json).
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Format check
        working-directory: frontend
        run: npm run format:check

      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b

      - name: Unit + component tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  e2e:
    name: End-to-end tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Amazon Corretto 25
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start DynamoDB Local
        run: docker compose up -d --wait dynamodb-local

      - name: Package and start the backend
        working-directory: backend
        run: |
          ./mvnw -B -q package -DskipTests
          # Packaged jars default to the "prod" runtime profile, which expects
          # real AWS DynamoDB/Secrets Manager - force "dev" so this uses
          # DynamoDB Local and the checked-in throwaway JWT keypair instead,
          # same as `quarkus:dev`.
          nohup java -Dquarkus.profile=dev -jar target/quarkus-app/quarkus-run.jar > ../backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health/ready && exit 0
            sleep 1
          done
          echo "Backend did not become ready in time" && cat ../backend.log && exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run Playwright
        working-directory: frontend
        run: npm run e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore
