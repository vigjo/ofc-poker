name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

# Cancel superseded runs on the same branch/PR instead of burning CI minutes
# on a commit nobody cares about anymore.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Amazon Corretto 25
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Start DynamoDB Local
        run: docker compose up -d --wait dynamodb-local
        working-directory: .

      - name: mvn verify (unit + integration tests)
        working-directory: backend
        run: ./mvnw -B verify -DskipITs=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/**
            backend/target/failsafe-reports/**
          retention-days: 7
          if-no-files-found: ignore

  image:
    name: Build image, SBOM, and vulnerability scan
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          tags: ofc-backend:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ofc-backend:ci
          format: cyclonedx-json
          output-file: backend-sbom.cdx.json

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ofc-backend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend-sbom.cdx.json
          retention-days: 30

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        # SHA-tagged only: the repository is IMMUTABLE (see
        # infra/bootstrap/main.tf), so a mutable "latest" tag can't coexist
        # with it, and deploy-staging.yml/deploy-production.yml always
        # deploy a specific SHA anyway - "latest" would just be unused.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ofc-backend:ci "${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}"
          docker push "${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}"
