# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
quarkus.application.name=ofc-backend
quarkus.http.port=8080
quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:5173,http://localhost:4173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-request-id
quarkus.http.cors.exposed-headers=x-request-id

# ---------------------------------------------------------------------------
# Request hardening: small JSON-only payloads, a bounded header size, and a
# grace period on shutdown so in-flight requests/websockets can drain during
# an ECS rolling deploy (see poker.ofc.room.ws.GracefulShutdown).
# ---------------------------------------------------------------------------
quarkus.http.limits.max-body-size=16K
quarkus.http.limits.max-header-size=16K
quarkus.shutdown.timeout=30s

# ---------------------------------------------------------------------------
# Rate limiting for the two unauthenticated endpoints (create/join room) -
# see poker.ofc.web.RateLimitFilter.
# ---------------------------------------------------------------------------
ofc.rate-limit.window-seconds=60
ofc.rate-limit.max-requests-per-window=20

# ---------------------------------------------------------------------------
# Security headers - see poker.ofc.web.SecurityHeadersFilter. HSTS only makes
# sense once TLS is terminated in front of the app (the ALB, in every
# deployed environment - both staging and production run the packaged jar's
# default "prod" runtime profile).
# ---------------------------------------------------------------------------
%prod.ofc.security.hsts-enabled=true

# ---------------------------------------------------------------------------
# Logging (structured JSON in prod/staging, readable console in dev)
# ---------------------------------------------------------------------------
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
quarkus.log.console.json.enabled=true
quarkus.log.level=INFO
quarkus.log.category."poker.ofc".level=INFO

# ---------------------------------------------------------------------------
# Health / metrics / OpenAPI
# ---------------------------------------------------------------------------
quarkus.smallrye-health.root-path=/health
quarkus.micrometer.export.prometheus.path=/metrics
quarkus.smallrye-openapi.path=/openapi
%dev.quarkus.swagger-ui.always-include=true
mp.openapi.extensions.smallrye.info.title=OFC Poker API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Private, invite-only Pineapple Open Face Chinese poker rooms for 2-3 guest players.

# ---------------------------------------------------------------------------
# Guest seat tokens (SmallRye JWT). privateKey.pem/publicKey.pem are a
# throwaway keypair for local dev/tests ONLY (checked in on purpose so
# `quarkus:dev` works with zero setup). Staging/production override both
# locations to paths populated at container start from AWS Secrets Manager -
# see infra/modules/backend-service and docs/runbooks/secrets-rotation.md.
# ---------------------------------------------------------------------------
mp.jwt.verify.issuer=https://ofc-poker.internal
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem
%prod.smallrye.jwt.sign.key.location=${OFC_JWT_PRIVATE_KEY_PATH:/app/secrets/privateKey.pem}
%prod.mp.jwt.verify.publickey.location=${OFC_JWT_PUBLIC_KEY_PATH:/app/secrets/publicKey.pem}
ofc.auth.token-ttl-minutes=180

# ---------------------------------------------------------------------------
# DynamoDB (see poker.ofc.room.persistence.DynamoDbClientProducer)
# Local dev/tests point at DynamoDB Local started via docker-compose. Each
# room is stored as a single versioned item containing its full snapshot
# (see poker.ofc.room.persistence.RoomRepository); recent in-hand events are
# only kept in memory for fast delta-sync and are not separately persisted -
# after a process restart, reconnecting clients always resync from the full
# snapshot instead of replaying history. See docs/rules.md.
# ---------------------------------------------------------------------------
ofc.dynamodb.endpoint-override=http://localhost:8000
ofc.dynamodb.region=us-east-1
ofc.dynamodb.table-prefix=ofc-dev-
%test.ofc.dynamodb.table-prefix=ofc-test-
%prod.ofc.dynamodb.endpoint-override=
ofc.dynamodb.rooms-table=${ofc.dynamodb.table-prefix}rooms

# ---------------------------------------------------------------------------
# Room lifecycle
# ---------------------------------------------------------------------------
ofc.room.max-players=3
ofc.room.min-players=2
ofc.room.disconnect-grace-seconds=90
ofc.room.abandoned-ttl-hours=24

# ---------------------------------------------------------------------------
# Container image (built by CI, see .github/workflows/backend-ci.yml)
# ---------------------------------------------------------------------------
quarkus.container-image.builder=docker
quarkus.container-image.group=ofc-poker
quarkus.container-image.name=ofc-backend
